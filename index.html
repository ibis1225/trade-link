<!doctype html><html lang="ko"><head><meta charset="utf-8">
<meta name="robots" content="noindex">
<title>미장 리포트로 이동</title></head>
<body style="font-family:sans-serif;padding:40px">
<p id="m">이동 중...</p>
<script>
// ?p=journal 처럼 경로를 주면 해당 페이지로 직행 (예: /trade-link/?p=day)
fetch('url.json?ts='+Date.now(),{cache:'no-store'})
  .then(r=>r.json()).then(d=>{
    var p=new URLSearchParams(location.search).get('p');
    location.replace(d.url+(p?'/'+encodeURIComponent(p)+'.html':''));
  })
  .catch(()=>{document.getElementById('m').innerHTML=
    '주소 조회 실패 — <a href="https://mentioned-neural-double-accessibility.trycloudflare.com">마지막 주소로 이동</a> (안 되면 잠시 후 새로고침)';});
</script>
<noscript><a href="https://mentioned-neural-double-accessibility.trycloudflare.com">리포트로 이동</a></noscript>
</body></html>
