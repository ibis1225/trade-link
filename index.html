<!doctype html><html lang="ko"><head><meta charset="utf-8">
<meta name="robots" content="noindex">
<title>미장 리포트로 이동</title></head>
<body style="font-family:sans-serif;padding:40px">
<p id="m">이동 중...</p>
<script>
fetch('url.json?ts='+Date.now(),{cache:'no-store'})
  .then(r=>r.json()).then(d=>location.replace(d.url))
  .catch(()=>{document.getElementById('m').innerHTML=
    '주소 조회 실패 — <a href="https://hist-walnut-human-night.trycloudflare.com">마지막 주소로 이동</a> (안 되면 잠시 후 새로고침)';});
</script>
<noscript><a href="https://hist-walnut-human-night.trycloudflare.com">리포트로 이동</a></noscript>
</body></html>
